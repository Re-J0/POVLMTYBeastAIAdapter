name: Finalize v0.3.3 release branch

on:
  push:
    branches:
      - fix-v0.3.3-fed-timer-init

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-v0.3.3-fed-timer-init
          fetch-depth: 0

      - name: Apply v0.3.3 release changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          def read(path):
              return Path(path).read_text(encoding='utf-8')
          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')
          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Expected text not found for {label}')
              return text.replace(old, new, 1)

          p = Path('Plugin.cs')
          t = read(p)
          t = replace_once(t, 'public const string PluginVersion = "0.3.1";', 'public const string PluginVersion = "0.3.3";', 'PluginVersion')
          t = replace_once(t, 'POV LMTY BeastAI Adapter 0.3.1 loaded.', 'POV LMTY BeastAI Adapter 0.3.3 loaded.', 'startup log')
          t = t.replace('Egg-based reproduction is a special LMTY path. v0.3.1 intentionally', 'Egg-based reproduction is a special LMTY path. v0.3.x intentionally')
          t = t.replace('"v0.3.1 will not auto-repair this special reproduction path; original LMTY will handle it."', '"v0.3.x will not auto-repair this special reproduction path; original LMTY will handle it."')

          old = '''            float before = zdo.GetFloat("TameTimeLeft", -1f);\n            if (before < 0f)\n                return;\n'''
          new = '''            float before = zdo.GetFloat("TameTimeLeft", -1f);\n            if (before < 0f)\n            {\n                // v0.3.3: another taming/feed patch can legitimately mark the creature\n                // as fed (IsHungry() == false) before this bridge consumes the ground\n                // item itself. In that case TameLastFeeding exists, but TameTimeLeft\n                // may still be absent. v0.3.1 returned here forever, so neither the\n                // native-observation window nor the fallback could ever start.\n                //\n                // Only seed the countdown when a real feeding timestamp exists. This\n                // prevents a freshly spawned, never-fed creature from starting taming\n                // merely because another mod temporarily reports it as not hungry.\n                long lastFeeding = zdo.GetLong("TameLastFeeding", 0L);\n                if (lastFeeding <= 0L)\n                {\n                    if (Time.time >= _nextDiagnostic)\n                    {\n                        _nextDiagnostic = Time.time + 3f;\n                        Plugin.Log.LogWarning(\n                            "[Adaptive Taming] Fed-state has no TameTimeLeft and no TameLastFeeding; " +\n                            "countdown not initialized: prefab=" + CleanName(gameObject.name)\n                        );\n                    }\n                    return;\n                }\n\n                before = Mathf.Max(0f, _tameable.m_tamingTime);\n                zdo.Set("TameTimeLeft", before);\n\n                _lastObservedTimeLeft = before;\n                _nativeObservationElapsed = 0f;\n                _nativeProgressConfirmed = false;\n                _fallbackActivated = false;\n                _observationLogged = false;\n\n                Plugin.Log.LogWarning(\n                    "[Adaptive Taming] Fed creature had no TameTimeLeft; initialized countdown: prefab=" +\n                    CleanName(gameObject.name) +\n                    "; TameTimeLeft=" + before.ToString("0.0") +\n                    "; TameLastFeeding=" + lastFeeding\n                );\n            }\n'''
          t = replace_once(t, old, new, 'TameTimeLeft initialization block')
          write(p, t)

          p = Path('README.md'); t = read(p)
          t = t.replace('**Current package release: 0.3.2** — branding/icon update only. Gameplay and compatibility logic are unchanged from the validated **0.3.1 runtime build**.', '**Current stable version: 0.3.3**')
          t = t.replace('**Current stable version: 0.3.2**', '**Current stable version: 0.3.3**')
          marker = 'This was added because POV `BeastAI` creatures could eat successfully while the native taming countdown remained frozen.\n'
          section = '''This was added because POV `BeastAI` creatures could eat successfully while the native taming countdown remained frozen.\n\n### v0.3.3 fed-state timer initialization fix\n\nDuring Gale/Thunderstore package validation, a second failure mode was reproduced: a repaired creature could already be fed (`hungry=False`) while `TameTimeLeft` was still absent (`-1`). Earlier builds returned at that point, so the native-observation window and fallback never started.\n\nv0.3.3 repairs that state only when a real `TameLastFeeding` timestamp exists. It initializes the missing countdown from the configured taming time, then runs the same six-second native-progress observation before deciding whether fallback is needed. Never-fed creatures are not initialized.\n'''
          if '### v0.3.3 fed-state timer initialization fix' not in t:
              t = replace_once(t, marker, section, 'README v0.3.3 section')
          old_validation = 'No `NullReferenceException`, general `Exception`, or `[Error` entry was present in the final 0.3.1 validation log.'
          if old_validation in t:
              t = t.replace(old_validation, 'Final v0.3.3 validation confirmed the missing-timer repair on a live 4-star Deer: `TameTimeLeft` was initialized from 120 seconds, fallback activated only after the six-second native-progress check, the timer reached 0, and taming completed with `tamed=True`. No `NullReferenceException`, general `Exception`, or `[Error` entry was present in that validation log.')
          t = t.replace(' v0.3.2 changes branding/version metadata only; compatibility logic is unchanged.', '')
          write(p, t)
          write('distribution/thunderstore/README.md', t)

          p = Path('README.ko-KR.md'); t = read(p)
          t = t.replace('**현재 패키지 릴리즈: 0.3.2** — 이번 버전은 아이콘/브랜딩 업데이트만 포함하며, 게임 로직과 호환성 동작은 검증된 **0.3.1 런타임 빌드와 동일**합니다.', '**현재 안정 버전: 0.3.3**')
          t = t.replace('**현재 안정 버전: 0.3.2**', '**현재 안정 버전: 0.3.3**')
          marker = '- 그 외에는 LMTY `SpawnMini()` 사용\n\n## 최종 테스트 결과'
          section = '''- 그 외에는 LMTY `SpawnMini()` 사용\n\n## 0.3.3 테이밍 타이머 초기화 수정\n\nGale/Thunderstore 배포본 검증 중, 사슴이 이미 먹은 상태(`hungry=False`)인데도 `TameTimeLeft`가 생성되지 않아 `-1`로 남는 경우를 확인했습니다. 이전 버전은 이 상태에서 반환해 버려 네이티브 타이머 관찰과 fallback이 시작되지 않을 수 있었습니다.\n\n0.3.3은 **실제 `TameLastFeeding` 기록이 존재할 때만** 누락된 `TameTimeLeft`를 설정된 길들이기 시간으로 초기화합니다. 이후 6초 동안 네이티브 진행을 먼저 관찰하고, 실제로 멈춰 있을 때만 기존 fallback을 활성화합니다. 한 번도 먹지 않은 생물은 이 복구 경로로 초기화하지 않습니다.\n\n## 최종 테스트 결과'''
          if '## 0.3.3 테이밍 타이머 초기화 수정' not in t:
              t = replace_once(t, marker, section, 'Korean README v0.3.3 section')
          t = t.replace('- 최종 v0.3.1 검증 로그에서 `NullReferenceException`, 일반 `Exception`, `[Error` 없음\n- v0.3.2는 아이콘/브랜딩 및 버전 메타데이터만 변경되며 호환 로직은 v0.3.1과 동일', '- v0.3.3에서 4성 Deer의 누락된 `TameTimeLeft`를 120초로 초기화한 뒤 6초 관찰 후 fallback이 정상 활성화되고, 120초 → 0초까지 감소하여 `tamed=True`로 길들이기 완료\n- 최종 v0.3.3 검증 로그에서 `NullReferenceException`, 일반 `Exception`, `[Error` 없음')
          write(p, t)

          p = Path('CHANGELOG.md'); t = read(p)
          if '## 0.3.3 - Fed-state timer initialization fix' not in t:
              entry = '''## 0.3.3 - Fed-state timer initialization fix\n\nCurrent stable release.\n\n- Fixed an adaptive-fallback dead state where a creature could be `hungry=False` while `TameTimeLeft` was still missing (`-1`).\n- If a valid `TameLastFeeding` timestamp exists but `TameTimeLeft` does not, the adapter now safely initializes the countdown from the configured taming time and starts the normal native-observation/fallback flow.\n- Never-fed creatures are not initialized: the repair requires a real feeding timestamp.\n- No changes to the generic POV structure detection, food list parsing, breeding configuration, or offspring logic.\n- Live validation confirmed a 4-star Deer progressed from the repaired 120-second countdown to `tamed=True`; the final log contained no `NullReferenceException`, general `Exception`, or `[Error` entry.\n\n'''
              t = replace_once(t, '# Changelog\n\n', '# Changelog\n\n' + entry, 'CHANGELOG v0.3.3 entry')
          t = t.replace('## 0.3.1 - Generic compatibility + adaptive taming fallback\n\nCurrent stable release.\n\n', '## 0.3.1 - Generic compatibility + adaptive taming fallback\n\n')
          write(p, t); write('distribution/thunderstore/CHANGELOG.md', t)

          p = Path('distribution/thunderstore/manifest.json')
          data = json.loads(read(p)); data['version_number'] = '0.3.3'
          write(p, json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          for fn in ['scripts/package_thunderstore.ps1', 'scripts/package_nexus.ps1']:
              p = Path(fn); t = read(p).replace('$Version = "0.3.2"', '$Version = "0.3.3"'); write(p, t)

          p = Path('build_and_install_gale_default.bat'); t = read(p)
          t = t.replace('v0.3.1 build/install script started', 'v0.3.3 build/install script started')
          t = t.replace('v0.3.1 intentionally leaves special egg-config auto-repair to original LMTY.', 'v0.3.3 intentionally leaves special egg-config auto-repair to original LMTY.')
          t = t.replace('For v0.3.1, only one fresh untamed Deer/Hare/Seal test is needed.', 'For v0.3.3, a fresh untamed POV BeastAI creature is sufficient for a focused taming test.')
          write(p, t)

          p = Path('docs/TECHNICAL_DETAILS.md'); t = read(p).replace('Version: 0.3.1', 'Version: 0.3.3')
          old = '''## Taming fallback\n\nThe bridge watches `TameTimeLeft` after feeding. It first gives the game/LMTY native logic an opportunity to progress.\n\nOnly after a six-second calm observation window with no progress does it invoke the fallback countdown path.\n'''
          new = '''## Taming fallback\n\nThe bridge watches `TameTimeLeft` after feeding. It first gives the game/LMTY native logic an opportunity to progress.\n\nIf the creature is already fed but `TameTimeLeft` is absent, v0.3.3 initializes the missing countdown only when a valid `TameLastFeeding` timestamp exists. This avoids starting taming on never-fed creatures.\n\nOnly after a six-second calm observation window with no progress does it invoke the fallback countdown path.\n'''
          if old in t: t = t.replace(old, new)
          write(p, t)

          p = Path('docs/DEVELOPMENT_HISTORY.md'); t = read(p)
          if '## 15. v0.3.3 missing `TameTimeLeft` regression' not in t:
              t = t.rstrip() + '''\n\n## 14. v0.3.2 packaging/icon update\n\nv0.3.2 changed package branding and the public icon only. The runtime compatibility logic remained the validated v0.3.1 implementation.\n\n## 15. v0.3.3 missing `TameTimeLeft` regression found during distribution validation\n\nA clean Gale/Thunderstore-style test exposed a state not covered by the earlier validation: a repaired Deer could already report `hungry=False` while its ZDO had no `TameTimeLeft` entry, so reads returned `-1`. The adaptive fallback treated a missing timer as non-actionable and returned before starting its six-second observation window.\n\nThe fix is intentionally conservative. When `TameTimeLeft` is missing, the adapter now checks for a real positive `TameLastFeeding` timestamp. Only then does it initialize the countdown from `Tameable.m_tamingTime`. It then follows the same native-observation and fallback decision path used before.\n\nLive validation with a 4-star Deer showed:\n\n- missing timer initialized to 120 seconds;\n- native timer remained stalled for the 6-second observation window;\n- fallback activated and reduced the countdown to 0;\n- Valheim completed taming and the adapter logged `tamed=True`;\n- no `NullReferenceException`, general `Exception`, or `[Error` entry was present in the final log.\n'''
          write(p, t)

          p = Path('NEXUS_DESCRIPTION.md'); t = read(p)
          i = t.find('\n## Version 0.3.2')
          if i != -1: t = t[:i]
          if '## Version 0.3.3' not in t:
              t = t.rstrip() + '''\n\n## Version 0.3.3\n\nFixes a fed-state taming deadlock where a repaired POV BeastAI creature could be `hungry=False` while `TameTimeLeft` was still missing. The adapter now initializes the missing countdown only when a valid `TameLastFeeding` timestamp exists, then preserves the existing six-second native-progress observation before enabling fallback.\n\nLive validation completed taming of a 4-star Deer from a repaired 120-second countdown to `tamed=True` with no `NullReferenceException`, general `Exception`, or `[Error` entry in the final log.\n'''
          write(p, t)

          p = Path('PUBLISHING.md'); t = read(p)
          t = t.replace('First release/tag:', 'Current release/tag:')
          t = t.replace('v0.3.2', 'v0.3.3')
          t = t.replace('POVLMTYBeastAIAdapter-0.3.2', 'POVLMTYBeastAIAdapter-0.3.3')
          t = t.replace('RELEASE_NOTES_0.3.2.md', 'RELEASE_NOTES_0.3.3.md')
          t = t.replace('For a future `0.3.3`:', 'For a future `0.3.4`:')
          write(p, t)

          plugin = read('Plugin.cs')
          assert 'PluginVersion = "0.3.3"' in plugin
          assert 'Fed creature had no TameTimeLeft; initialized countdown' in plugin
          assert '"version_number": "0.3.3"' in read('distribution/thunderstore/manifest.json')
          assert '**Current stable version: 0.3.3**' in read('README.md')
          PY

      - name: Commit generated release changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No release changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Plugin.cs README.md README.ko-KR.md CHANGELOG.md \
            distribution/thunderstore/README.md distribution/thunderstore/CHANGELOG.md \
            distribution/thunderstore/manifest.json scripts/package_thunderstore.ps1 \
            scripts/package_nexus.ps1 build_and_install_gale_default.bat \
            docs/TECHNICAL_DETAILS.md docs/DEVELOPMENT_HISTORY.md \
            NEXUS_DESCRIPTION.md PUBLISHING.md
          git commit -m "Finalize v0.3.3 stable release"
          git push origin HEAD:fix-v0.3.3-fed-timer-init
